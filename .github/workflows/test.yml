name: Test Homebrew installation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Install published formula
        run: brew install mightymorgs/tap/remotefs
      - name: Test installed formula
        run: |
          brew test mightymorgs/tap/remotefs
          remotefs --version
          remotefs --help
