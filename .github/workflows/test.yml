name: Test Homebrew installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install formula from checkout
        run: |
          brew tap mightymorgs/tap
          cp Formula/remotefs.rb "$(brew --repository mightymorgs/tap)/Formula/remotefs.rb"
          brew install --build-from-source mightymorgs/tap/remotefs
      - name: Test installed formula
        run: |
          brew test mightymorgs/tap/remotefs
          remotefs --version
          remotefs --help
